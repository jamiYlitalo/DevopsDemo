services:
  api:
    build:
      context: ../app
      dockerfile: Dockerfile
    image: fastapi-app:validation
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
