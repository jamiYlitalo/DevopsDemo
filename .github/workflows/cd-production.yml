name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  packages: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-production-url.com
      # Add approval rules in GitHub → Settings → Environments → production

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/fastapi-app:${{ github.event.workflow_run.head_sha }}
        run: docker pull "$IMAGE"

      - name: Start production smoke-test container
        env:
          IMAGE: ghcr.io/${{ github.repository }}/fastapi-app:${{ github.event.workflow_run.head_sha }}
        run: docker run --detach --name fastapi-production --publish 8000:8000 "$IMAGE"

      - name: Run production smoke test
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs fastapi-production
          exit 1

      - name: Stop production container
        if: always()
        run: docker rm --force fastapi-production
