name: Staging Deployment Validation

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Docker image
        working-directory: infra
        run: docker compose build

      - name: Start staging service
        working-directory: infra
        run: docker compose up --detach

      - name: Wait for health endpoint
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs --no-color > infra/staging-container.log
          exit 1

      - name: Run API smoke tests
        run: |
          curl --fail --silent http://localhost:8000/metrics
          curl --fail --silent \
            --header "Content-Type: application/json" \
            --data '{"name":"staging-smoke-test","value":42,"metadata":{"source":"ci"}}' \
            http://localhost:8000/validate

      - name: Collect container logs
        if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color > infra/staging-container.log

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-container-logs
          path: infra/staging-container.log

      - name: Tear down staging service
        if: always()
        working-directory: infra
        run: docker compose down --volumes
